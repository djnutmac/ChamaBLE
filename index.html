<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chameleon Ultra — HF Group Manager</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 900px;
      margin: auto;
    }
    h1 { font-size: 1.3rem; color: #38bdf8; margin: 0 0 4px 0; }
    p.subtitle { color: var(--text-dim); font-size: 0.85rem; margin: 0 0 14px 0; }
    
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-blue { background: var(--accent); color: white; }
    .btn-red { background: var(--danger); color: white; }
    .btn-dark { background: #334155; color: #f8fafc; }
    .btn-dark:hover { background: #475569; }
    .btn-green { background: var(--success); color: white; width: 100%; font-size: 1rem; padding: 12px; margin-top: 10px; }

    .tools-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      align-items: center;
    }

    .group-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
    .group-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .group-tab.active { background: var(--accent); color: white; border-color: #38bdf8; }
    .group-tab .count { display: block; font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }

    .group-panel {
      background: #131d31;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    
    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 115px;
    }
    .slot-card.empty { border-style: dashed; opacity: 0.6; align-items: center; justify-content: center; text-align: center; }
    .slot-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .slot-num { font-weight: bold; color: #38bdf8; font-size: 0.75rem; }
    .card-name { font-weight: 600; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .card-uid { font-family: monospace; font-size: 0.75rem; color: var(--text-dim); }

    .slot-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #334155;
    }
    .slot-btn {
      background: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .slot-btn:hover { background: #475569; color: #fff; }
    .slot-btn-danger:hover { background: #dc2626; color: #fff; }
    .slot-select {
      background: #334155;
      color: #cbd5e1;
      border: none;
      border-radius: 4px;
      padding: 3px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .opt-row { margin-top: 10px; font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    #log {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #a5f3fc;
      height: 100px;
      overflow-y: auto;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <h1>Chameleon Ultra — HF Manager</h1>
  <p class="subtitle">Gestione, ordinamento e scrittura selettiva banchi Mifare Classic</p>

  <!-- Strumenti Globali -->
  <div class="tools-bar">
    <label class="btn btn-dark" style="cursor: pointer;">
      ⬆ Carica File JSON (Bulk)
      <input type="file" id="bulkInput" multiple accept=".json" style="display: none;">
    </label>
    <button id="btnExportPresets" class="btn btn-dark">⬇ Scarica presets.json</button>
    <button id="btnResetPresets" class="btn btn-dark" title="Ricarica da presets.json originale">🔄 Ripristina</button>
  </div>

  <div style="display: flex; gap: 8px; margin-bottom: 14px;">
    <button id="btnConnect" class="btn btn-blue">1. Connetti BLE ᛒ</button>
    <button id="btnDisconnect" class="btn btn-red" style="display: none;">Disconnetti</button>
  </div>

  <!-- Barra di selezione Gruppi -->
  <div class="group-nav" id="groupNav"></div>

  <!-- Pannello del Gruppo Attivo -->
  <div class="group-panel">
    <div class="panel-header">
      <strong id="currentGroupName" style="color: #38bdf8; font-size: 1rem;">Gruppo 1</strong>
      <div style="display: flex; gap: 6px;">
        <label class="btn btn-dark" style="cursor: pointer; font-size: 0.75rem; padding: 6px 10px;">
          + Riempi Gruppo
          <input type="file" id="groupFileInput" multiple accept=".json" style="display: none;">
        </label>
        <button id="btnClearGroup" class="btn btn-red" style="padding: 6px 10px; font-size: 0.75rem;">Svuota</button>
      </div>
    </div>

    <div class="slots-grid" id="slotsGrid"></div>

    <button id="btnFlashGroup" class="btn btn-green" disabled>2. Scrivi questo Gruppo sul Chameleon</button>
    
    <div class="opt-row">
      <input type="checkbox" id="chkAutoDisconnect" checked>
      <label for="chkAutoDisconnect">Disconnetti automaticamente il BLE al termine del flash</label>
    </div>
  </div>

  <div id="log">Pronto. In attesa di comandi...</div>

  <script type="module">
    import { Buffer, ChameleonUltra, Slot, TagFreq } from 'https://cdn.jsdelivr.net/npm/chameleon-ultra.js@0/+esm';
    import WebbleAdapter from 'https://cdn.jsdelivr.net/npm/chameleon-ultra.js@0/plugin/WebbleAdapter/+esm';

    const ultra = new ChameleonUltra();
    ultra.use(new WebbleAdapter());

    const slotsEnum = [
      Slot.SLOT_1, Slot.SLOT_2, Slot.SLOT_3, Slot.SLOT_4,
      Slot.SLOT_5, Slot.SLOT_6, Slot.SLOT_7, Slot.SLOT_8
    ];

    // Inizializzazione 5 gruppi da 8 slot ciascuno
    let groups = [
      new Array(8).fill(null), new Array(8).fill(null),
      new Array(8).fill(null), new Array(8).fill(null),
      new Array(8).fill(null)
    ];
    let currentGroupIndex = 0;

    const groupNav = document.getElementById('groupNav');
    const slotsGrid = document.getElementById('slotsGrid');
    const currentGroupName = document.getElementById('currentGroupName');
    const groupFileInput = document.getElementById('groupFileInput');
    const bulkInput = document.getElementById('bulkInput');
    const btnExportPresets = document.getElementById('btnExportPresets');
    const btnResetPresets = document.getElementById('btnResetPresets');
    const btnClearGroup = document.getElementById('btnClearGroup');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnFlashGroup = document.getElementById('btnFlashGroup');
    const chkAutoDisconnect = document.getElementById('chkAutoDisconnect');
    const logBox = document.getElementById('log');

    function log(msg) {
      logBox.innerHTML += `\n> ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function normalizeGroupsData(rawData) {
      const normalized = [];
      const dataGroups = Array.isArray(rawData) ? rawData : (rawData.groups || []);
      for (let g = 0; g < 5; g++) {
        const groupArr = new Array(8).fill(null);
        if (dataGroups[g] && Array.isArray(dataGroups[g])) {
          for (let s = 0; s < 8; s++) {
            groupArr[s] = dataGroups[g][s] || null;
          }
        }
        normalized.push(groupArr);
      }
      return normalized;
    }

    async function loadPresetsFromRemote() {
      try {
        const res = await fetch(`presets.json?t=${Date.now()}`);
        if (res.ok) {
          const raw = await res.json();
          groups = normalizeGroupsData(raw);
          saveToStorage();
          log("Configurazione sincronizzata da presets.json!");
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function initData() {
      const cached = localStorage.getItem('cu_user_groups');
      if (cached) {
        try {
          groups = normalizeGroupsData(JSON.parse(cached));
          log("Dati caricati dalla memoria locale.");
        } catch (e) {
          await loadPresetsFromRemote();
        }
      } else {
        await loadPresetsFromRemote();
      }
      renderUI();
    }

    function saveToStorage() {
      localStorage.setItem('cu_user_groups', JSON.stringify(groups));
      renderUI();
    }

    function renderUI() {
      // 1. Barra Navigazione Gruppi (G1..G5)
      groupNav.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const tab = document.createElement('div');
        tab.className = `group-tab ${i === currentGroupIndex ? 'active' : ''}`;
        const count = groups[i].filter(x => x !== null).length;
        tab.innerHTML = `G${i + 1}<span class="count">${count}/8</span>`;
        tab.addEventListener('click', () => {
          currentGroupIndex = i;
          renderUI();
        });
        groupNav.appendChild(tab);
      }

      // 2. Titolo Gruppo
      currentGroupName.innerText = `Gruppo ${currentGroupIndex + 1}`;

      // 3. Grid degli 8 Slot
      slotsGrid.innerHTML = '';
      const currentGroup = groups[currentGroupIndex];

      for (let s = 0; s < 8; s++) {
        const item = currentGroup[s];
        const cardDiv = document.createElement('div');
        cardDiv.className = `slot-card ${item ? '' : 'empty'}`;

        if (item) {
          cardDiv.innerHTML = `
            <div>
              <div class="slot-top">
                <span class="slot-num">SLOT ${s + 1}</span>
                <button class="slot-btn slot-btn-danger" title="Elimina slot" data-action="delete" data-slot="${s}">🗑️</button>
              </div>
              <div class="card-name" title="${item.name || 'Senza Nome'}">${item.name || 'Senza Nome'}</div>
              <div class="card-uid">UID: ${item.uid}</div>
            </div>
            
            <div class="slot-actions">
              <button class="slot-btn" title="Sposta a sinistra" data-action="move-left" data-slot="${s}" ${s === 0 ? 'disabled' : ''}>◀</button>
              <button class="slot-btn" title="Sposta a destra" data-action="move-right" data-slot="${s}" ${s === 7 ? 'disabled' : ''}>▶</button>
              
              <select class="slot-select" data-action="move-group" data-slot="${s}">
                <option value="" disabled selected>⇄ Gruppo</option>
                ${[0,1,2,3,4].filter(g => g !== currentGroupIndex).map(g => `<option value="${g}">In G${g + 1}</option>`).join('')}
              </select>

              <label class="slot-btn" style="cursor: pointer;" title="Sostituisci file">
                📁
                <input type="file" accept=".json" style="display: none;" data-action="replace-file" data-slot="${s}">
              </label>
            </div>
          `;
        } else {
          cardDiv.innerHTML = `
            <div class="slot-num" style="margin-bottom: 6px;">SLOT ${s + 1} (Vuoto)</div>
            <label class="btn btn-dark" style="cursor: pointer; font-size: 0.75rem;">
              + Carica JSON
              <input type="file" accept=".json" style="display: none;" data-action="single-upload" data-slot="${s}">
            </label>
          `;
        }
        slotsGrid.appendChild(cardDiv);
      }

      // 4. Gestione Eventi Slot
      slotsGrid.querySelectorAll('[data-action]').forEach(el => {
        const action = el.getAttribute('data-action');
        const slotIdx = parseInt(el.getAttribute('data-slot'));

        if (action === 'delete') {
          el.addEventListener('click', () => {
            groups[currentGroupIndex][slotIdx] = null;
            saveToStorage();
            log(`Slot ${slotIdx + 1} svuotato.`);
          });
        } else if (action === 'move-left') {
          el.addEventListener('click', () => {
            if (slotIdx > 0) {
              const temp = groups[currentGroupIndex][slotIdx];
              groups[currentGroupIndex][slotIdx] = groups[currentGroupIndex][slotIdx - 1];
              groups[currentGroupIndex][slotIdx - 1] = temp;
              saveToStorage();
            }
          });
        } else if (action === 'move-right') {
          el.addEventListener('click', () => {
            if (slotIdx < 7) {
              const temp = groups[currentGroupIndex][slotIdx];
              groups[currentGroupIndex][slotIdx] = groups[currentGroupIndex][slotIdx + 1];
              groups[currentGroupIndex][slotIdx + 1] = temp;
              saveToStorage();
            }
          });
        } else if (action === 'move-group') {
          el.addEventListener('change', (e) => {
            const targetGroup = parseInt(e.target.value);
            const freeIndex = groups[targetGroup].findIndex(x => x === null);
            if (freeIndex !== -1) {
              groups[targetGroup][freeIndex] = groups[currentGroupIndex][slotIdx];
              groups[currentGroupIndex][slotIdx] = null;
              saveToStorage();
              log(`Card spostata in G${targetGroup + 1} (Slot ${freeIndex + 1})`);
            } else {
              alert(`Il Gruppo ${targetGroup + 1} è già pieno (8/8)!`);
              renderUI();
            }
          });
        } else if (action === 'single-upload' || action === 'replace-file') {
          el.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
              const text = await file.text();
              const json = JSON.parse(text);
              groups[currentGroupIndex][slotIdx] = json;
              saveToStorage();
              log(`File caricato nello Slot ${slotIdx + 1}`);
            } catch (err) {
              log(`Errore lettura file: ${err.message}`);
            }
          });
        }
      });

      const hasCards = groups[currentGroupIndex].some(x => x !== null);
      btnFlashGroup.disabled = !(ultra.isConnected && hasCards);
    }

    // Caricamento Bulk (distribuisce da 1 a 40 file sui 5 gruppi)
    bulkInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.name.endsWith('.json'));
      if (files.length === 0) return;
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      const allCards = [];
      for (let f of files) {
        try {
          const text = await f.text();
          allCards.push(JSON.parse(text));
        } catch (err) {}
      }

      groups = [
        new Array(8).fill(null), new Array(8).fill(null),
        new Array(8).fill(null), new Array(8).fill(null),
        new Array(8).fill(null)
      ];

      allCards.slice(0, 40).forEach((card, idx) => {
        const g = Math.floor(idx / 8);
        const s = idx % 8;
        groups[g][s] = card;
      });

      saveToStorage();
      log(`Caricati ${allCards.length} file distribuiti nei 5 gruppi!`);
      bulkInput.value = '';
    });

    // Riempi solo il gruppo attivo
    groupFileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.name.endsWith('.json'));
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      for (let i = 0; i < Math.min(files.length, 8); i++) {
        try {
          const text = await files[i].text();
          groups[currentGroupIndex][i] = JSON.parse(text);
        } catch (err) {}
      }

      saveToStorage();
      log(`Gruppo ${currentGroupIndex + 1} aggiornato.`);
      groupFileInput.value = '';
    });

    btnResetPresets.addEventListener('click', async () => {
      if (confirm("Ripristinare da presets.json originale?")) {
        const ok = await loadPresetsFromRemote();
        if (ok) renderUI();
        else alert("Impossibile caricare presets.json.");
      }
    });

    btnExportPresets.addEventListener('click', () => {
      const jsonStr = JSON.stringify(groups, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'presets.json';
      a.click();
      URL.revokeObjectURL(url);
      log("File presets.json esportato!");
    });

    btnClearGroup.addEventListener('click', () => {
      if (confirm(`Svuotare Gruppo ${currentGroupIndex + 1}?`)) {
        groups[currentGroupIndex] = new Array(8).fill(null);
        saveToStorage();
      }
    });

    btnConnect.addEventListener('click', async () => {
      try {
        log("Ricerca Chameleon Ultra BLE...");
        await ultra.connect();
        log("Connesso al Chameleon Ultra!");
        btnConnect.style.display = "none";
        btnDisconnect.style.display = "inline-block";
        renderUI();
      } catch (err) {
        log("Errore BLE: " + err.message);
      }
    });

    btnDisconnect.addEventListener('click', async () => {
      try {
        await ultra.disconnect();
        log("Chameleon disconnesso.");
        btnConnect.style.display = "inline-block";
        btnDisconnect.style.display = "none";
        renderUI();
      } catch (err) {
        log("Errore disconnessione: " + err.message);
      }
    });

    async function writeMf1BlockSafe(blockIndex, block16Bytes) {
      const buf = Buffer.from(block16Bytes);
      if (typeof ultra.cmdMf1SetBlockData === 'function') {
        try {
          return await ultra.cmdMf1SetBlockData(blockIndex, buf);
        } catch (e) {
          return await ultra.cmdMf1SetBlockData({ block: blockIndex, data: buf });
        }
      }
    }

    // Scrittura batch HF
    btnFlashGroup.addEventListener('click', async () => {
      const activeCards = groups[currentGroupIndex];
      btnFlashGroup.disabled = true;
      log(`Scrittura Gruppo ${currentGroupIndex + 1}...`);

      for (let i = 0; i < 8; i++) {
        const item = activeCards[i];
        const slot = slotsEnum[i];

        if (!item) {
          try {
            await ultra.cmdSlotSetEnable(slot, TagFreq.HF, false);
            await ultra.cmdSlotSetEnable(slot, TagFreq.LF, false);
            log(`Slot ${i + 1}: Disabilitato (vuoto)`);
          } catch (e) {}
          continue;
        }

        log(`Slot ${i + 1}: Flash (${item.name || item.uid})...`);
        try {
          // 1. Attiva lo slot
          await ultra.cmdSlotSetActive(slot);

          // 2. Anticollisione HF (UID, SAK, ATQA)
          const uidBytes = item.uid.replace(/\s+/g, '').match(/.{1,2}/g).map(b => parseInt(b, 16));
          await ultra.cmdHf14aSetAntiCollData({
            uid: Buffer.from(uidBytes),
            atqa: Buffer.from(item.atqa || [0, 4]),
            sak: Buffer.from([typeof item.sak === 'number' ? item.sak : 8])
          });

          // 3. Scrittura dei 64 blocchi Mifare Classic
          for (let b = 0; b < 64; b++) {
            const blockData = item.data[b] || new Array(16).fill(0);
            await writeMf1BlockSafe(b, blockData);
          }

          // 4. Abilita HF e disabilita LF
          await ultra.cmdSlotSetEnable(slot, TagFreq.HF, true);
          await ultra.cmdSlotSetEnable(slot, TagFreq.LF, false);

        } catch (err) {
          log(`Errore Slot ${i + 1}: ${err.message}`);
        }
      }

      log(`Gruppo ${currentGroupIndex + 1} scritto con successo!`);

      if (chkAutoDisconnect.checked) {
        try {
          await ultra.disconnect();
          log("BLE disconnesso automaticamente.");
          btnConnect.style.display = "inline-block";
          btnDisconnect.style.display = "none";
        } catch (e) {}
      }

      renderUI();
    });

    initData();
  </script>
</body>
</html>
