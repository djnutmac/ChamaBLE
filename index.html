<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chameleon Ultra Group Manager</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --accent: #0284c7;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      max-width: 850px;
      margin: auto;
    }
    h1 { font-size: 1.3rem; color: #38bdf8; margin: 0 0 4px 0; }
    p.subtitle { color: var(--text-dim); font-size: 0.85rem; margin: 0 0 16px 0; }
    
    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-blue { background: var(--accent); color: white; }
    .btn-red { background: var(--danger); color: white; }
    .btn-green { background: var(--success); color: white; width: 100%; font-size: 1rem; padding: 12px; margin-top: 10px; }
    
    .group-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
    .group-tab {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .group-tab.active { background: var(--accent); color: white; border-color: #38bdf8; }
    .group-tab .count { display: block; font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }

    .group-panel {
      background: #131d31;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .file-btn {
      background: #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
    .slot-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 0.8rem; }
    .slot-card.empty { border-style: dashed; opacity: 0.5; }
    .slot-card .slot-num { font-weight: bold; color: #38bdf8; font-size: 0.75rem; }
    .slot-card .card-name { font-weight: 600; margin: 4px 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-card .card-uid { font-family: monospace; font-size: 0.7rem; color: var(--text-dim); }

    .opt-row { margin-top: 10px; font-size: 0.85rem; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
    #log {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #a5f3fc;
      height: 90px;
      overflow-y: auto;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <h1>Chameleon Ultra — Multi-Group BLE</h1>
  <p class="subtitle">Gestione e caricamento selettivo banchi RFID</p>

  <div style="display: flex; gap: 8px; margin-bottom: 14px;">
    <button id="btnConnect" class="btn btn-blue">1. Connetti BLE ᛒ</button>
    <button id="btnDisconnect" class="btn btn-red" style="display: none;">Disconnetti</button>
  </div>

  <div class="group-nav" id="groupNav"></div>

  <div class="group-panel">
    <div class="panel-header">
      <div>
        <strong id="currentGroupName" style="color: #38bdf8; font-size: 1rem;">Gruppo 1</strong>
        <span id="groupCapacityLabel" style="font-size: 0.8rem; color: var(--text-dim); margin-left: 6px;">(max 8 card)</span>
      </div>
      <div style="display: flex; gap: 6px;">
        <label class="file-btn">
          + Carica File JSON
          <input type="file" id="groupFileInput" multiple accept=".json" style="display: none;">
        </label>
        <button id="btnClearGroup" class="btn btn-red" style="padding: 6px 10px; font-size: 0.75rem;">Svuota</button>
      </div>
    </div>

    <div class="slots-grid" id="slotsGrid"></div>

    <button id="btnFlashGroup" class="btn btn-green" disabled>2. Scrivi questo Gruppo sul Chameleon</button>
    
    <div class="opt-row">
      <input type="checkbox" id="chkAutoDisconnect" checked>
      <label for="chkAutoDisconnect">Disconnetti automaticamente il BLE al termine del flash</label>
    </div>
  </div>

  <div id="log">In attesa di connessione BLE...</div>

  <script type="module">
    import { Buffer, ChameleonUltra, Slot, TagType } from 'https://cdn.jsdelivr.net/npm/chameleon-ultra.js@0/+esm';
    import WebbleAdapter from 'https://cdn.jsdelivr.net/npm/chameleon-ultra.js@0/plugin/WebbleAdapter/+esm';

    const ultra = new ChameleonUltra();
    ultra.use(new WebbleAdapter());

    const slotsEnum = [
      Slot.SLOT_1, Slot.SLOT_2, Slot.SLOT_3, Slot.SLOT_4,
      Slot.SLOT_5, Slot.SLOT_6, Slot.SLOT_7, Slot.SLOT_8
    ];

    const groupLimits = [8, 8, 8, 8, 7];
    let groups = [[], [], [], [], []];
    let currentGroupIndex = 0;

    const groupNav = document.getElementById('groupNav');
    const slotsGrid = document.getElementById('slotsGrid');
    const currentGroupName = document.getElementById('currentGroupName');
    const groupCapacityLabel = document.getElementById('groupCapacityLabel');
    const groupFileInput = document.getElementById('groupFileInput');
    const btnClearGroup = document.getElementById('btnClearGroup');
    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const btnFlashGroup = document.getElementById('btnFlashGroup');
    const chkAutoDisconnect = document.getElementById('chkAutoDisconnect');
    const logBox = document.getElementById('log');

    function log(msg) {
      logBox.innerHTML += `\n> ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function loadFromStorage() {
      const data = localStorage.getItem('cu_user_groups');
      if (data) {
        try { groups = JSON.parse(data); } catch (e) { groups = [[], [], [], [], []]; }
      }
    }

    function saveToStorage() {
      localStorage.setItem('cu_user_groups', JSON.stringify(groups));
      renderUI();
    }

    function renderUI() {
      groupNav.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const tab = document.createElement('div');
        tab.className = `group-tab ${i === currentGroupIndex ? 'active' : ''}`;
        const count = groups[i]?.length || 0;
        const max = groupLimits[i];
        tab.innerHTML = `G${i + 1}<span class="count">${count}/${max}</span>`;
        tab.addEventListener('click', () => {
          currentGroupIndex = i;
          renderUI();
        });
        groupNav.appendChild(tab);
      }

      currentGroupName.innerText = `Gruppo ${currentGroupIndex + 1}`;
      groupCapacityLabel.innerText = `(max ${groupLimits[currentGroupIndex]} card)`;

      slotsGrid.innerHTML = '';
      const activeCards = groups[currentGroupIndex] || [];
      const limit = groupLimits[currentGroupIndex];

      for (let s = 0; s < 8; s++) {
        const item = activeCards[s];
        const isSupportedByGroup = s < limit;
        const cardDiv = document.createElement('div');
        cardDiv.className = `slot-card ${item ? '' : 'empty'}`;

        if (!isSupportedByGroup) {
          cardDiv.innerHTML = `
            <div class="slot-num" style="color: #64748b;">SLOT ${s + 1}</div>
            <div class="card-name" style="color: #64748b;">Disabilitato</div>
            <div class="card-uid">—</div>
          `;
        } else if (item) {
          cardDiv.innerHTML = `
            <div class="slot-num">SLOT ${s + 1}</div>
            <div class="card-name">${item.name || 'Senza Nome'}</div>
            <div class="card-uid">${item.uid}</div>
          `;
        } else {
          cardDiv.innerHTML = `
            <div class="slot-num">SLOT ${s + 1}</div>
            <div class="card-name" style="color: var(--text-dim);">Vuoto</div>
            <div class="card-uid">—</div>
          `;
        }
        slotsGrid.appendChild(cardDiv);
      }

      btnFlashGroup.disabled = !(ultra.isConnected && activeCards.length > 0);
    }

    groupFileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => f.name.endsWith('.json'));
      const limit = groupLimits[currentGroupIndex];
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

      const loadedCards = [];
      for (let f of files.slice(0, limit)) {
        try {
          const text = await f.text();
          loadedCards.push(JSON.parse(text));
        } catch (err) {
          log(`Errore lettura file ${f.name}`);
        }
      }

      groups[currentGroupIndex] = loadedCards;
      saveToStorage();
      log(`Caricati ${loadedCards.length} file nel Gruppo ${currentGroupIndex + 1}.`);
      groupFileInput.value = '';
    });

    btnClearGroup.addEventListener('click', () => {
      if (confirm(`Vuoi svuotare il Gruppo ${currentGroupIndex + 1}?`)) {
        groups[currentGroupIndex] = [];
        saveToStorage();
        log(`Gruppo ${currentGroupIndex + 1} svuotato.`);
      }
    });

    // Connessione BLE
    btnConnect.addEventListener('click', async () => {
      try {
        log("Ricerca Chameleon Ultra BLE...");
        await ultra.connect();
        log("Dispositivo BLE connesso!");
        btnConnect.style.display = "none";
        btnDisconnect.style.display = "inline-block";
        renderUI();
      } catch (err) {
        log("Errore BLE: " + err.message);
      }
    });

    // Disconnessione Manuale
    btnDisconnect.addEventListener('click', async () => {
      try {
        await ultra.disconnect();
        log("Chameleon disconnesso con successo.");
        btnConnect.style.display = "inline-block";
        btnDisconnect.style.display = "none";
        renderUI();
      } catch (err) {
        log("Errore disconnessione: " + err.message);
      }
    });

    // Scrittura batch e auto-disconnect opzionale
    btnFlashGroup.addEventListener('click', async () => {
      const activeCards = groups[currentGroupIndex] || [];
      if (activeCards.length === 0) return;

      btnFlashGroup.disabled = true;
      log(`Avvio sovrascrittura Gruppo ${currentGroupIndex + 1}...`);

      for (let i = 0; i < 8; i++) {
        const item = activeCards[i];

        if (!item) {
          try {
            await ultra.cmdSlotSetEnable(slotsEnum[i], false);
            log(`Slot ${i + 1}: Disabilitato`);
          } catch (e) {}
          continue;
        }

        log(`Scrittura Slot ${i + 1} (${item.name || item.uid})...`);
        try {
          await ultra.cmdSlotSetTagType(slotsEnum[i], item.tag || TagType.MIFARE_1024);
          await ultra.cmdSlotSetActiveSlot(slotsEnum[i]);

          const uidBytes = item.uid.replace(/\s+/g, '').match(/.{1,2}/g).map(b => parseInt(b, 16));
          await ultra.cmdHf14aSetAntiCollData({
            uid: Buffer.from(uidBytes),
            atqa: Buffer.from(item.atqa),
            sak: Buffer.from([item.sak])
          });

          await ultra.cmdMf1WriteBlockData(Buffer.from(item.data.flat()));
          await ultra.cmdSlotSetEnable(slotsEnum[i], true);
        } catch (err) {
          log(`Errore Slot ${i + 1}: ${err.message}`);
        }
      }

      log(`Gruppo ${currentGroupIndex + 1} scritto con successo!`);

      // Se spuntato, disconnette automaticamente il Bluetooth per uso autonomo
      if (chkAutoDisconnect.checked) {
        try {
          await ultra.disconnect();
          log("BLE disconnesso automaticamente. Il Chameleon è pronto all'uso.");
          btnConnect.style.display = "inline-block";
          btnDisconnect.style.display = "none";
        } catch (e) {}
      }

      renderUI();
    });

    loadFromStorage();
    renderUI();
  </script>
</body>
</html>
